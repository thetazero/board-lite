[package]
name = "board-lite"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["server"]
# The website and its rooms; without it, the rules alone (the WASM module).
server = ["dep:bytes", "dep:futures-util", "dep:getrandom", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:libc", "dep:sha2", "dep:tokio", "dep:unicode-general-category"]
# What the tests, the screenshots and the playtest runner drive (src/host.ts); not in the image.
stage = ["server"]

[lib]
name = "board_lite"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "board-lite"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "stage"
path = "src/bin/stage.rs"
required-features = ["stage"]

# Answers test/rust-parity.test.ts; not in the image.
[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
bytes = { version = "1", optional = true }
futures-util = { optional = true, version = "0.3", default-features = false, features = ["alloc"] }
getrandom = { version = "0.3", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { optional = true, version = "1", features = ["http1", "server"] }
hyper-util = { optional = true, version = "0.1", default-features = false, features = ["tokio"] }
indexmap = { version = "2", features = ["serde"] }
libc = { version = "0.2", optional = true }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
sha2 = { version = "0.10", optional = true }
tokio = { optional = true, version = "1", features = ["rt", "net", "io-util", "io-std", "time", "sync", "macros", "signal", "process"] }
unicode-general-category = { version = "1", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.wasm]
inherits = "release"
opt-level = 3
panic = "abort"

# npm run serve: quicker to build.
[profile.home]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
