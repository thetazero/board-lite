name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    # The whole run takes about a minute. Past 5 it is cancelled and fails.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # `npm test` takes 30-40 s here (about 8 s on a dev machine). Past
      # TEST_CAP seconds it is stopped and the run fails as too slow. Raise
      # the cap only on purpose, and say why in the PR.
      - name: npm test (capped)
        env:
          TEST_CAP: 120
        run: |
          start=$SECONDS
          set +e
          timeout --kill-after=10 "$TEST_CAP" npm test
          code=$?
          set -e
          took=$((SECONDS - start))
          echo "npm test took ${took}s (cap ${TEST_CAP}s)"
          if [ "$code" = 124 ] || [ "$code" = 137 ]; then
            echo "::error title=Tests too slow::npm test ran past its ${TEST_CAP}s cap and was stopped. It usually takes 30-40s on CI. Find what made it slower, or raise TEST_CAP in .github/workflows/ci.yml on purpose and say why in the PR."
          fi
          exit "$code"
  # The Rust website (docs/rust-server.md) plays, answers and saves as the Node one does.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run rust:build
      - run: cargo test --release --locked --manifest-path rust/Cargo.toml
      - run: node --test test/rust-parity.test.ts test/rust-server.test.ts
      - run: docker build -f Dockerfile.rust -t board-lite-rust .
      - run: |
          docker run -d --name site -p 8080:8080 --read-only --cap-drop ALL -v games:/data -e BOARD_LITE_PUBLIC_URL=https://dragons.example board-lite-rust
          for i in $(seq 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          docker exec site /board-lite --health
          curl -fsS -X POST localhost:8080/api/rooms | grep hostToken
          curl -fsS localhost:8080/vendor/three/three.module.js -o /dev/null
  # The public website's container (docs/deploy.md) builds, starts, and answers.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t board-lite .
      - run: |
          docker run -d --name site -p 8080:8080 --read-only -v games:/data -e BOARD_LITE_PUBLIC_URL=https://dragons.example board-lite
          for i in $(seq 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS -X POST localhost:8080/api/rooms | grep hostToken
          curl -fsS localhost:8080/vendor/three/three.module.js -o /dev/null
          curl -fsS localhost:8080/llms.txt | grep https://dragons.example/mcp
  # Each merge to main that passes is published, for whatever machine runs the
  # website to pull (docs/deploy.md).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
